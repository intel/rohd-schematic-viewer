name: Extension release artifact

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions: {}

jobs:
  build-vsix:
    name: Build Marketplace VSIX
    permissions:
      contents: read
    timeout-minutes: 60
    runs-on: ${{ github.repository_owner == 'intel' && 'ubuntu-latest' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate extension version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          make verify-extension-version
          pubspec_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          package_name="$(node -p "require('./package.json').name")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME#v}" = "$pubspec_version"
          fi
          echo "vsix=build/${package_name}-${pubspec_version}.vsix" >> "$GITHUB_OUTPUT"
          echo "version=${pubspec_version}" >> "$GITHUB_OUTPUT"

      - name: Install project dependencies
        run: tool/gh_actions/install_dependencies.sh

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test web platform initialization
        run: |
          export CHROME_EXECUTABLE="$(node -p "require('playwright').chromium.executablePath()")"
          make test-web

      - name: Build Marketplace VSIX
        run: make extension FLUTTER_WEB_MODE=release FLUTTER_WEB_WASM=1

      - name: Verify Marketplace VSIX
        run: make verify-vsix

      - name: Smoke-test packaged Wasm and JavaScript runtimes
        run: npm run test:vsix -- "${{ steps.package.outputs.vsix }}"

      - name: Checksum verified VSIX
        env:
          VSIX: ${{ steps.package.outputs.vsix }}
        run: |
          cd build
          sha256sum "${VSIX#build/}" > "${VSIX#build/}.sha256"

      - name: Upload Marketplace VSIX
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: intel-corporation-rohd-schematic-viewer-${{ steps.package.outputs.version }}-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.vsix }}
            ${{ steps.package.outputs.vsix }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload webview test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsix-webview-tests-${{ github.sha }}
          path: build/vsix-smoke/
          if-no-files-found: ignore
          retention-days: 30

      - name: Add admin publication instructions
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          VSIX: ${{ steps.package.outputs.vsix }}
        run: |
          {
            echo '## Verified Intel VSIX'
            echo
            echo "Download the [tested VSIX artifact](${ARTIFACT_URL}) and extract the GitHub artifact ZIP."
            echo 'Verify the included checksum, then install and review the VSIX in the target VS Code environment.'
            echo 'An authorized admin for the intel-corporation Marketplace publisher can upload the contained VSIX through the publisher management page.'
            echo 'Do not upload the GitHub ZIP or rebuild the package before publication.'
            echo
            echo 'Marketplace signing happens after publication. This workflow does not publish or require Marketplace credentials.'
            echo
            echo "\`sha256sum -c ${VSIX#build/}.sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Intentionally no `vsce publish` step. After the Intel Marketplace
      # publisher and trusted publishing policy are configured, add a protected
      # publish job using `vsce publish --packagePath ... --oidc`.
