name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Code Coverage
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Flutter on PATH
        run: bash scripts/verify_flutter_version.sh

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lcov

      - name: Install project dependencies
        run: tool/gh_actions/install_dependencies.sh

      - name: Generate coverage report
        run: bash scripts/generate_coverage.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
