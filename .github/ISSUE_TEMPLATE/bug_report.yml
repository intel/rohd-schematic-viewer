name: Bug Report
description: Report a problem.
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: describe-bug
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: If possible, please include code that reproduces the failure.
      placeholder: |
        Steps to reproduce the behavior:
        1. Use class ... for ...
        2. Run a simulation with ...
        3. See error

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What you observed instead of the expected behavior?

  - type: input
    id: viewer-version
    attributes:
      label: ROHD Schematic Viewer version
      description: >
        Provide the package, extension, or hosted-viewer version. If the
        version is unavailable, provide the hosted-viewer URL or build ID.
      placeholder: "For example: 0.2.0"
    validations:
      required: true

  - type: input
    id: platform-browser
    attributes:
      label: Platform and browser
      description: >
        Provide the operating system or device and, when applicable, the
        browser or host application and its version.
      placeholder: "For example: Ubuntu 24.04 with Chrome 140"
    validations:
      required: true

  - type: textarea
    id: flutter-version
    attributes:
      label: Flutter SDK information
      description: >
        For local builds or embedded use, paste the output of
        'flutter --version'. Hosted-viewer users can leave this blank.
      placeholder: |
        $ flutter --version
        Flutter ...
      render: shell

  - type: textarea
    id: pubspec
    attributes:
      label: "Additional: pubspec.yaml"
      description: >
        For local builds or embedded use, paste the relevant dependencies from
        your 'pubspec.yaml' and identify the version of ROHD you're using.
        Hosted-viewer users can leave this blank.
      placeholder: your 'pubspec.yaml' file here...
      render: yaml

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional: Context"
      description: Add any other context about the problem here.
